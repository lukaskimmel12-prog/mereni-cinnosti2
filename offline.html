<!DOCTYPE html>
<html lang="cs">
<head>

      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: #f58220;
      color: white;
      font-size: 16px;
      font-weight: 900;
    }

</head>
<body>
  <div class="card">

    <h1>Bez připojení</h1>

    <button onclick="location.reload()">ZKUSIT ZNOVU</button>
